<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeakTrace — Pool Leak Detection Reports</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#12313A; --ink-2:#0C232A; --aqua:#1DBFAE; --aqua-soft:#DCF4F0;
    --paper:#F6F3EC; --paper-2:#FFFFFF; --amber:#DD8933; --text:#1B1F1E;
    --text-soft:#5B6664; --line:#DAD5C8; --danger:#B84A3E;
    --pass:#1E8A63; --pass-bg:#E1F3E9; --attn:#B4790F; --attn-bg:#FBEBCF;
    --fail:#B84A3E; --fail-bg:#F7E4E1; --na:#8A8F8B; --na-bg:#ECEAE3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:10px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .ripple-mark{position:relative;width:22px;height:22px;flex:none;}
  .ripple-mark span{position:absolute;border-radius:50%;border:1.5px solid var(--aqua);inset:0;}
  .ripple-mark span:nth-child(2){inset:5px;background:var(--aqua);border:none;}
  .brand-name{font-weight:600;font-size:18px;letter-spacing:.2px;}
  .brand-sub{font-size:11px;color:#9FC2C0;font-family:'JetBrains Mono',monospace;letter-spacing:.5px;text-transform:uppercase;}
  #topbarActions{display:flex;gap:8px;flex-wrap:wrap;}

  .btn{border:none;border-radius:8px;padding:10px 16px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .08s ease, opacity .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--aqua);color:var(--ink-2);}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);}
  .btn-ghost:hover{background:rgba(255,255,255,.08);}
  .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-outline:hover{background:#EFEBDF;}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(184,74,62,.4);}
  .btn-danger:hover{background:rgba(184,74,62,.08);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  #app{max-width:920px;margin:0 auto;padding:24px 18px 90px;}

  .list-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .list-header h1{font-size:26px;margin:0 0 4px;color:var(--ink);}
  .list-header p{margin:0;color:var(--text-soft);font-size:13.5px;}
  input.search{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);font-size:14px;margin-bottom:16px;}
  .report-card{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;}
  .report-card:hover{border-color:var(--aqua);}
  .rc-name{font-weight:600;font-size:15px;color:var(--ink);}
  .rc-meta{font-size:12px;color:var(--text-soft);margin-top:2px;font-family:'JetBrains Mono',monospace;}
  .status-pill{font-size:10.5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:20px;flex:none;}
  .status-draft{background:#F1E6D2;color:#8A6416;}
  .status-complete{background:var(--aqua-soft);color:#106E63;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-soft);}
  .empty-state .ripple-mark{width:40px;height:40px;margin:0 auto 14px;}
  .empty-state span{border-width:2px;}

  .field-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .field{flex:1;min-width:150px;display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.4px;}
  .field input,.field select,.field textarea{padding:9px 10px;border-radius:7px;border:1px solid var(--line);font-size:14px;font-family:'Inter',sans-serif;background:var(--paper-2);width:100%;}
  textarea{resize:none;overflow:hidden;}
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;}
  .card h3{margin:0 0 12px;font-size:13px;color:var(--ink);text-transform:uppercase;letter-spacing:.5px;}
  .card .subnote{font-size:12px;color:var(--text-soft);margin:-8px 0 12px;}

  .letterhead-preview{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .logo-box{width:56px;height:56px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper);flex:none;}
  .logo-box img{width:100%;height:100%;object-fit:contain;}

  .kv-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
  .kv-row .kv-label{width:38%;font-size:12.5px;font-weight:600;color:var(--ink);}
  .kv-row .kv-value{flex:1;font-size:13.5px;}
  .kv-row input,.kv-row textarea{padding:8px 9px;border-radius:6px;border:1px solid var(--line);font-family:'Inter',sans-serif;background:var(--paper-2);}
  .kv-row textarea{resize:none;overflow:hidden;min-height:35px;line-height:1.35;}
  .kv-row .item-del{margin-top:6px;}

  .cat{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden;}
  .cat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .cat-tag{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--aqua);display:flex;align-items:center;justify-content:center;font-size:11px;font-family:'JetBrains Mono',monospace;flex:none;}
  .cat-head input.cat-title{flex:1;min-width:140px;border:none;background:transparent;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15.5px;color:var(--ink);padding:4px 2px;}
  .cat-head input.cat-title:focus{outline:none;border-bottom:1.5px solid var(--aqua);}
  .cat-body{padding:14px;}
  .cat-body textarea.cat-intro{width:100%;min-height:44px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.5px;color:var(--text-soft);margin-bottom:12px;}

  .item-card{border:1px solid var(--line);border-radius:8px;padding:10px 10px 8px;margin-bottom:8px;background:var(--paper);}
  .item-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .item-top input.item-label{flex:1;min-width:120px;border:none;background:transparent;font-weight:600;font-size:13.5px;color:var(--ink);padding:4px 2px;border-bottom:1px solid transparent;}
  .item-top input.item-label:focus{outline:none;border-bottom:1.5px solid var(--aqua);}
  textarea.item-note{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12.5px;margin-bottom:8px;min-height:34px;}
  select.status-select{border:none;border-radius:20px;font-size:11.5px;font-weight:700;padding:5px 10px;font-family:'JetBrains Mono',monospace;cursor:pointer;flex:none;}
  select.status-select.st-Pass{background:var(--pass-bg);color:var(--pass);}
  select.status-select.st-Attention{background:var(--attn-bg);color:var(--attn);}
  select.status-select.st-Fail{background:var(--fail-bg);color:var(--fail);}
  select.status-select.st-N\/A{background:var(--na-bg);color:var(--na);}
  .item-del{background:none;border:none;color:var(--text-soft);cursor:pointer;font-size:15px;padding:2px 4px;flex:none;}
  .item-del:hover{color:var(--danger);}
  .media-thumb{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1.28;background:#EFEBDF;}
  .media-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .media-thumb .no-poster{width:100%;height:100%;background:var(--ink);opacity:.85;}
  .media-thumb button{position:absolute;top:3px;right:3px;background:var(--danger);color:#fff;border:1.5px solid #fff;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;}
  .media-thumb.video{cursor:pointer;}
  .media-thumb .play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none;}
  .media-thumb .dur-badge{position:absolute;bottom:3px;left:4px;background:rgba(12,35,42,.8);color:#fff;font-size:9.5px;font-family:'JetBrains Mono',monospace;padding:1px 5px;border-radius:8px;pointer-events:none;}
  .media-overlay{position:fixed;inset:0;background:rgba(12,35,42,.92);display:flex;align-items:center;justify-content:center;z-index:90;padding:18px;cursor:zoom-out;}
  .media-overlay video{max-width:100%;max-height:100%;border-radius:8px;background:#000;}
  .media-close{position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .media-close:hover{background:rgba(255,255,255,.28);}
  .item-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-bottom:8px;}
  .item-photo-thumb{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1.28;background:#EFEBDF;}
  .item-photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .item-photo-thumb button{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;border:1.5px solid #fff;border-radius:50%;width:19px;height:19px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .item-photo-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .add-photo-label.sm{padding:5px 9px;font-size:11px;}

  .login-wrap{max-width:400px;margin:9vh auto 0;}
  .login-wrap h1{font-size:24px;margin:0 0 6px;color:var(--ink);}
  .login-wrap p{margin:0 0 18px;color:var(--text-soft);font-size:14px;line-height:1.5;}
  .fld-label{display:block;font-size:11.5px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.4px;margin:0 0 5px;}
  .login-wrap input[type=email],.login-wrap input[type=password],.login-wrap input[type=text]{
    width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);
    font-size:16px;font-family:'Inter',sans-serif;background:var(--paper-2);margin-bottom:14px;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:62px !important;}
  .pw-toggle{position:absolute;top:12px;right:10px;background:none;border:none;cursor:pointer;
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--text-soft);padding:4px 6px;}
  .pw-toggle:hover{color:var(--ink);}
  .fld-hint{font-size:12px;color:var(--text-soft);margin:-9px 0 14px;}
  .auth-row{display:flex;justify-content:flex-end;margin:-6px 0 14px;}
  .auth-foot{margin-top:16px;font-size:13.5px;color:var(--text-soft);text-align:center;}
  .linkish{background:none;border:none;color:var(--aqua);font:inherit;font-size:13px;font-weight:600;
    text-decoration:underline;cursor:pointer;padding:0;}
  .linkish:hover{color:var(--ink);}

  .btn-block{width:100%;justify-content:center;}
  .msg{padding:11px 13px;border-radius:8px;font-size:13.5px;margin-bottom:14px;line-height:1.45;}
  .msg.ok{background:var(--aqua-soft);color:#106E63;}
  .msg.err{background:var(--fail-bg);color:var(--fail);}
  .share-box{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);}
  .share-box label.row{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13.5px;color:var(--ink);font-weight:600;}
  .share-box input[type=checkbox]{width:18px;height:18px;margin-top:1px;flex:none;accent-color:var(--aqua);}
  .share-hint{font-size:12px;color:var(--text-soft);margin-top:7px;line-height:1.45;}
  .share-hint.warn{color:var(--attn);}
  .shared-flag{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--aqua);letter-spacing:.3px;}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .filter-chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--paper-2);cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;font-weight:600;color:var(--text-soft);}
  .filter-chip:hover{border-color:var(--aqua);}
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .filter-chip .cnt{opacity:.65;font-family:'JetBrains Mono',monospace;font-size:11px;}
  .rc-no{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--aqua);font-weight:600;}
  .color-row{display:flex;gap:10px;align-items:center;}
  .color-row input[type=color]{width:52px;height:38px;padding:2px;border-radius:7px;border:1px solid var(--line);background:var(--paper-2);cursor:pointer;}
  .color-row input[type=text]{width:120px;font-family:'JetBrains Mono',monospace;}
  .tpl-sections-label{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px 2px;}
  .rev-badge{font-size:9.5px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:10px;letter-spacing:.3px;vertical-align:middle;}
  .rev-badge.ok{background:var(--pass-bg);color:var(--pass);}
  .rev-badge.wait{background:var(--attn-bg);color:var(--attn);}
  .rev-badge.no{background:var(--fail-bg);color:var(--fail);}
  .rev-note{font-size:12.5px;color:var(--attn);background:var(--attn-bg);padding:8px 10px;border-radius:7px;margin-top:9px;line-height:1.45;}
  .cat-disc{font-size:11.5px;color:var(--text-soft);margin-top:4px;line-height:1.5;white-space:pre-wrap;background:var(--paper);padding:8px;border-radius:6px;}
  .cat-card{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;}
  .cat-card .cat-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;border:none;padding:0;}
  .cat-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15.5px;color:var(--ink);}
  .cat-mine{font-size:9.5px;font-family:'JetBrains Mono',monospace;background:var(--aqua-soft);color:#106E63;padding:2px 6px;border-radius:10px;vertical-align:middle;letter-spacing:.3px;}
  .cat-meta{font-size:11.5px;color:var(--text-soft);font-family:'JetBrains Mono',monospace;margin-top:3px;}
  .cat-desc{font-size:13px;color:var(--text);margin-top:9px;line-height:1.45;}
  .cat-preview{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .cat-prev-row{font-size:12.5px;color:var(--text-soft);margin-bottom:5px;}
  .cat-prev-row b{color:var(--ink);font-weight:600;margin-right:5px;}
  .cat-sect{margin-top:8px;}
  .cat-sect-title{font-size:12.5px;font-weight:600;color:var(--ink);}
  .cat-sect-items{font-size:11.5px;color:var(--text-soft);margin-top:2px;line-height:1.5;}
  .cat-empty{text-align:center;padding:44px 20px;color:var(--text-soft);font-size:13.5px;}
  .pub-check{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);}
  .pub-check input{width:18px;height:18px;margin-top:1px;flex:none;accent-color:var(--aqua);}
  .pub-note{font-size:12px;color:var(--text-soft);line-height:1.5;margin-top:9px;padding:10px;background:var(--paper);border-radius:7px;}
  .pub-state{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--aqua);letter-spacing:.3px;}
  .preset-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .preset-tab{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--paper-2);cursor:pointer;font-size:12.5px;font-family:'Inter',sans-serif;font-weight:600;color:var(--text-soft);}
  .preset-tab:hover{border-color:var(--aqua);}
  .preset-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .preset-tab .star{color:var(--amber);}
  .preset-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .preset-name{flex:1;min-width:160px;padding:9px 11px;border-radius:7px;border:1px solid var(--line);font-size:14px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--ink);background:var(--paper-2);}
  .preset-default-badge{font-size:11.5px;font-family:'JetBrains Mono',monospace;color:var(--amber);padding:5px 9px;border-radius:20px;background:#FBEBCF;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(12,35,42,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal{background:var(--paper-2);border-radius:12px;padding:20px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;}
  .modal h3{margin:0 0 4px;font-size:17px;color:var(--ink);}
  .modal p{margin:0 0 14px;font-size:13px;color:var(--text-soft);}
  .preset-choice{display:block;width:100%;text-align:left;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);margin-bottom:8px;cursor:pointer;font-family:'Inter',sans-serif;}
  .preset-choice:hover{border-color:var(--aqua);}
  .preset-choice b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px;}
  .preset-choice span{font-size:12px;color:var(--text-soft);}
  .status-sent{background:#DCE7F5;color:#2A5B94;}
  .tpl-item-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .tpl-item-row input{flex:1;padding:7px 9px;border-radius:6px;border:1px solid var(--line);font-size:13px;font-family:'Inter',sans-serif;}
  .add-item-row{display:flex;gap:8px;margin-bottom:4px;}
  .add-item-row input{flex:1;padding:7px 9px;border-radius:6px;border:1px dashed var(--line);font-size:12.5px;}

  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0;}
  .photo-thumb{position:relative;border-radius:7px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1.39;background:#EFEBDF;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb button{position:absolute;top:5px;right:5px;background:var(--danger);color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;font-size:16px;font-weight:700;cursor:pointer;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;}
  .photo-thumb button:active{transform:scale(.92);}
  .photo-thumb input.caption{position:absolute;bottom:0;left:0;right:0;background:rgba(18,49,58,.7);color:#fff;border:none;font-size:10px;padding:3px 5px;font-family:'Inter',sans-serif;}
  .add-photo-label{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:7px;padding:8px 12px;font-size:12.5px;color:var(--text-soft);cursor:pointer;}
  .add-photo-label:hover{border-color:var(--aqua);color:var(--ink);}
  .add-photo-label input{display:none;}

  .cat-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .add-cat-bar{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .add-cat-bar input{flex:1;min-width:160px;padding:9px 10px;border-radius:7px;border:1px solid var(--line);font-size:13.5px;}

  .sticky-actions{position:sticky;bottom:0;background:linear-gradient(0deg,var(--paper) 60%,transparent);padding:16px 0 4px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .back-link{display:inline-flex;align-items:center;gap:5px;color:var(--text-soft);font-size:13px;cursor:pointer;margin-bottom:14px;font-weight:600;}
  .back-link:hover{color:var(--ink);}
  @media(max-width:520px){.field-row{flex-direction:column;} table.items-table td{padding:5px 3px;}}
</style>
</head>
<body>

/* Same key-based interface the app already used, now backed by Supabase. */
async function storeGet(key){
  if(!sb || !currentUserId()) return null;
  try{
    if(key === 'business-profile'){
      const { data, error } = await sb.from('business_profile').select('data').eq('owner_id', currentUserId()).maybeSingle();
      if(error) throw error;
      return data ? data.data : null;
    }
    if(key === 'category-presets'){
      const { data, error } = await sb.from('presets').select('data').eq('owner_id', currentUserId()).maybeSingle();
      if(error) throw error;
      return data ? data.data : null;
    }
    if(key === 'reports-index'){
      const { data, error } = await sb.from('reports')
        .select('id, report_number, client_name, property_address, report_date, status, shared_with_client, updated_at')
        .eq('owner_id', currentUserId())
        .order('updated_at', { ascending:false });
      if(error) throw error;
      return (data||[]).map(r=>({
        id: r.id,
        reportNumber: r.report_number,
        clientName: r.client_name || 'Untitled report',
        address: r.property_address || '',
        date: r.report_date || '',
        status: r.status || 'Draft',
        shared: !!r.shared_with_client,
        updatedAt: r.updated_at ? new Date(r.updated_at).getTime() : 0
      }));
    }
    if(key.indexOf('report:') === 0){
      const { data, error } = await sb.from('reports').select('data').eq('id', key.slice(7)).maybeSingle();
      if(error) throw error;
      return data ? data.data : null;
    }
    return null;
  }catch(e){ console.error('storeGet failed', key, e); return null; }
}

async function storeSet(key,value){
  if(!sb) return {ok:false, message:'Not connected to Supabase'};
  if(!currentUserId()) return {ok:false, message:'Not signed in'};
  try{
    if(key === 'business-profile'){
      const { error } = await sb.from('business_profile')
        .upsert({ owner_id: currentUserId(), data: value }, { onConflict:'owner_id' });
      if(error) throw error;
      return {ok:true};
    }
    if(key === 'category-presets'){
      const { error } = await sb.from('presets')
        .upsert({ owner_id: currentUserId(), data: value }, { onConflict:'owner_id' });
      if(error) throw error;
      return {ok:true};
    }
    if(key === 'reports-index') return {ok:true};   // derived from the reports table
    if(key.indexOf('report:') === 0){
      const r = value;
      const email = (reportEmail(r)||'').trim().toLowerCase();
      const { error } = await sb.from('reports').upsert({
        id: r.id,
        owner_id: currentUserId(),
        report_number: r.reportNumber || null,
        client_name: reportClientName(r) || null,
        client_email: email || null,
        property_address: reportAddress(r) || null,
        report_date: reportDateOf(r),
        status: r.status || 'Draft',
        shared_with_client: !!r.sharedWithClient,
        data: r
      }, { onConflict:'id' });
      if(error) throw error;
      return {ok:true};
    }
    return {ok:true};
  }catch(e){
    console.error('storeSet failed', key, e);
    return {ok:false, message: (e && e.message) ? e.message : String(e)};
  }
}

  (r.categories||[]).forEach(cat=>{
    cat.photos = cat.photos || [];
    (cat.items||[]).forEach(it=>{ it.photos = it.photos || []; });
  });
  if(!r.reportTitle)       r.reportTitle = DEFAULT_REPORT_TITLE;

  if(!r.summaryHeading)    r.summaryHeading = DEFAULT_SUMMARY_HEADING;
  if(!r.disclaimerHeading) r.disclaimerHeading = DEFAULT_DISCLAIMER_HEADING;
  // Older reports stored these as fixed properties; fold them into the editable list.
  if(!r.customerFields || !r.customerFields.length){
    r.customerFields = DEFAULT_CUSTOMER_FIELDS.map(f=>({
      id: uid(), label: f.label, role: f.role,
      value: f.role==='name'    ? (r.clientName||'')
           : f.role==='phone'   ? (r.clientContact||'')
           : f.role==='address' ? (r.propertyAddress||'')
           : f.role==='email'   ? (r.clientEmail||'') : ''
    }));
  }
  (r.customerFields||[]).forEach(f=>{ if(!f.id) f.id = uid(); if(typeof f.role !== 'string') f.role=''; });
  if(!r.summaryFields || !r.summaryFields.length){
    r.summaryFields = [

  (r.summaryFields||[]).forEach(f=>{ if(!f.id) f.id = uid(); });
  if(typeof r.sharedWithClient !== 'boolean') r.sharedWithClient = false;
  return r;
}

/* Storage-independent backup: download/restore a report as a .json file on-device. */
function downloadJSON(filename, data){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadReportBackup(silent){
  if(!state.current) return;
  const name = ((reportClientName(state.current)||'report').replace(/[^a-z0-9]+/gi,'_'))+'_backup.json';
  downloadJSON(name, state.current);
  if(!silent) showToast('Backup downloaded');
}
function restoreReportBackup(fileList){
  const f = fileList[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data.id) data.id = uid();
      if(!data.categories) throw new Error('not a report backup');
      state.current = normalizeReport(data);
      state.view = 'editor';
      render();
      showToast('Backup loaded — remember to Save');
    }catch(err){ showToast('Could not read that backup file'); }
  };
  reader.readAsText(f);
}

/* Resize + re-encode an image file so it stores compactly (storage keys are capped at 5MB). */
function fileToCompressedDataUrl(file, maxDim, quality){
  maxDim = maxDim || 1400; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, maxDim / Math.max(width, height));
        const w = Math.max(1, Math.round(width*scale)), h = Math.max(1, Math.round(height*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function autoGrowTextareas(container){
  (container||document).querySelectorAll('textarea').forEach(ta=>{
    if(ta._autoGrowBound) return;
    const resize = ()=>{ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; };
    ta.addEventListener('input', resize);
    ta._autoGrowBound = true;
    resize();
  });
}

async function init(){
  if(!CONFIGURED){ renderConfigWarning(); return; }
  const { data } = await sb.auth.getSession();
  state.session = data.session;

  sb.auth.onAuthStateChange(async (event, session)=>{
    // A reset link signs the user in, so hold them on the new-password form
    // instead of dropping them into the app with a password they can't recall.
    if(event === 'PASSWORD_RECOVERY'){
      state.session = session;
      state.recovering = true;
      state.authMsg = null;
      render();
      return;
    }
    const wasIn = !!state.session;
    state.session = session;
    if(session && !wasIn && !state.recovering){
      state.view='list'; state.authMsg=null;
      await loadEverything();
      render();
    }
    if(!session && wasIn){
      state.view='list'; state.reportsIndex=[]; state.current=null;
      render();
    }
  });

  // Recovery links can also be read straight off the URL on first load.
  if((window.location.hash||'').indexOf('type=recovery') >= 0){
    state.recovering = true;
  }

  if(state.session && !state.recovering) await loadEverything();
  render();
}

/* ---------------- staff auth (email + password) ----------------
   Passwords suit people signing in every day. Customers keep magic
   links in the portal — they shouldn't have to manage a password for
   a one-off report. Passwords are never stored or logged here;
   Supabase hashes them server-side. */

const MIN_PASSWORD = 8;

function authMode(){ return state.authMode || 'signin'; }
function setAuthMode(m){
  state.authMode = m;
  state.authMsg = null;
  render();
}

function friendlyAuthError(msg){
  const m = (msg||'').toLowerCase();
  if(m.indexOf('invalid login credentials') >= 0)
    return "That email and password don't match an account. Check for typos, or reset your password.";
  if(m.indexOf('already registered') >= 0 || m.indexOf('already been registered') >= 0)
    return 'There is already an account with that email. Sign in instead.';
  if(m.indexOf('email not confirmed') >= 0)
    return 'Confirm your email first — check your inbox for the confirmation link.';
  if(m.indexOf('password should be') >= 0)
    return 'That password is too short. Use at least ' + MIN_PASSWORD + ' characters.';
  if(m.indexOf('rate limit') >= 0 || m.indexOf('too many') >= 0)
    return 'Too many attempts. Wait a minute and try again.';
  return msg || 'Something went wrong. Try again.';
}

function readAuthField(id){
  const el = document.getElementById(id);
  return el ? el.value : '';
}
/* A failed attempt re-renders the form, which would otherwise wipe everything
   typed. Hold on to the email so nobody has to retype it after a typo in the
   password. Passwords are intentionally not preserved. */
function rememberEmail(v){ state.authEmail = v; }
function validEmail(e){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e); }

async function signInWithPassword(){
  const email = readAuthField('authEmail').trim();
  const password = readAuthField('authPassword');
  if(!validEmail(email)){
    state.authMsg = {type:'err', text:'Enter a valid email address.'};
    return render();
  }
  if(!password){
    state.authMsg = {type:'err', text:'Enter your password.'};
    return render();
  }
  state.authBusy = true; state.authMsg = null; render();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  state.authBusy = false;
  if(error){
    state.authMsg = {type:'err', text: friendlyAuthError(error.message)};
    render();
  }
  // success is handled by onAuthStateChange
}

async function createAccount(){
  const email = readAuthField('authEmail').trim();
  const password = readAuthField('authPassword');
  const confirm  = readAuthField('authConfirm');
  if(!validEmail(email)){
    state.authMsg = {type:'err', text:'Enter a valid email address.'};
    return render();
  }
  if(password.length < MIN_PASSWORD){
    state.authMsg = {type:'err', text:'Use a password of at least ' + MIN_PASSWORD + ' characters.'};
    return render();
  }
  if(password !== confirm){
    state.authMsg = {type:'err', text:'The two passwords do not match.'};
    return render();
  }
  state.authBusy = true; state.authMsg = null; render();
  const { data, error } = await sb.auth.signUp({
    email, password,
    options:{ emailRedirectTo: window.location.href.split('#')[0] }
  });
  state.authBusy = false;
  if(error){
    state.authMsg = {type:'err', text: friendlyAuthError(error.message)};
    return render();
  }
  if(data && data.session){
    return;   // signed straight in; onAuthStateChange takes it from here
  }
  state.authMode = 'signin';
  state.authMsg = {type:'ok', text:'Account created. Check your inbox for a confirmation link, then sign in.'};
  render();
}

async function sendPasswordReset(){
  const email = readAuthField('authEmail').trim();
  if(!validEmail(email)){
    state.authMsg = {type:'err', text:'Enter the email address on your account.'};
    return render();
  }
  state.authBusy = true; state.authMsg = null; render();
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.href.split('#')[0]
  });
  state.authBusy = false;
  state.authMode = 'signin';
  // Deliberately the same message either way, so this can't be used to
  // find out which email addresses have accounts.
  state.authMsg = {type:'ok', text:'If there is an account for ' + email + ', a reset link is on its way.'};
  render();
}

async function setNewPassword(){
  const password = readAuthField('authPassword');
  const confirm  = readAuthField('authConfirm');
  if(password.length < MIN_PASSWORD){
    state.authMsg = {type:'err', text:'Use a password of at least ' + MIN_PASSWORD + ' characters.'};
    return render();
  }
  if(password !== confirm){
    state.authMsg = {type:'err', text:'The two passwords do not match.'};
    return render();
  }
  state.authBusy = true; state.authMsg = null; render();
  const { error } = await sb.auth.updateUser({ password });
  state.authBusy = false;
  if(error){
    state.authMsg = {type:'err', text: friendlyAuthError(error.message)};
    return render();
  }
  state.recovering = false;
  state.authMode = 'signin';
  state.authMsg = {type:'ok', text:'Password updated.'};
  if(state.session){ await loadEverything(); }
  render();
}

function togglePasswordView(id, btn){
  const el = document.getElementById(id);
  if(!el) return;
  const showing = el.type === 'text';
  el.type = showing ? 'password' : 'text';
  btn.textContent = showing ? 'Show' : 'Hide';
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
}

  state.view = 'list'; state.authMode = 'signin'; state.recovering = false; state.authEmail = '';
  render();
}

      ${pwField('authConfirm','Confirm password','new-password')}`;
  } else if(mode === 'forgot'){
    fields = `
      <label class="fld-label" for="authEmail">Email</label>
      <input type="email" id="authEmail" autocomplete="username"
             value="${esc(state.authEmail||'')}"
             oninput="rememberEmail(this.value)"
             onkeydown="if(event.key==='Enter') submitAuth();">`;
  } else {
    fields = `
      ${pwField('authPassword','New password','new-password')}
      <div class="fld-hint">At least ${MIN_PASSWORD} characters.</div>
      ${pwField('authConfirm','Confirm new password','new-password')}`;
  }

  const button = {
    signin: busy ? 'Signing in…'  : 'Sign in',
    signup: busy ? 'Creating…'    : 'Create account',
    forgot: busy ? 'Sending…'     : 'Email me a reset link',
    reset:  busy ? 'Saving…'      : 'Save new password'
  }[mode];

  const footer = {
    signin: `New here? <button type="button" class="linkish" onclick="setAuthMode('signup')">Create an account</button>`,
    signup: `Already have an account? <button type="button" class="linkish" onclick="setAuthMode('signin')">Sign in</button>`,
    forgot: `<button type="button" class="linkish" onclick="setAuthMode('signin')">Back to sign in</button>`,
    reset:  ''
  }[mode];

  app.innerHTML = `
    <div class="login-wrap">
      <h1>${copy.h}</h1>
      <p>${copy.p}</p>
      ${m ? `<div class="msg ${m.type}">${esc(m.text)}</div>` : ''}
      ${fields}
      <button class="btn btn-primary btn-block" onclick="submitAuth()" ${busy?'disabled':''}>${button}</button>
      ${footer ? `<div class="auth-foot">${footer}</div>` : ''}
    </div>`;

  const focusId = (mode === 'reset') ? 'authPassword'
                : (state.authEmail && mode !== 'forgot') ? 'authPassword'
                : 'authEmail';
  const first = document.getElementById(focusId);
  if(first) first.focus();
}

function submitAuth(){
  const mode = state.recovering ? 'reset' : authMode();
  if(mode === 'signin') return signInWithPassword();
  if(mode === 'signup') return createAccount();
  if(mode === 'forgot') return sendPasswordReset();
  return setNewPassword();
}

/* ---------------- video attachments ----------------
   Videos are 50-100x the size of a photo, so they go to Supabase
   Storage rather than into the report record. We keep only a path,
   plus a poster frame grabbed client-side for thumbnails and the PDF. */
const MEDIA_BUCKET      = 'report-media';
const MAX_VIDEO_BYTES   = 60 * 1024 * 1024;   // matches the bucket ceiling
const MAX_VIDEO_SECONDS = 90;

function isVideo(m){ return m && m.type === 'video'; }
function mediaExt(file){
  const m = /\.([a-z0-9]+)$/i.exec(file.name||'');
  if(m) return m[1].toLowerCase();
  if((file.type||'').indexOf('quicktime') >= 0) return 'mov';
  if((file.type||'').indexOf('webm') >= 0) return 'webm';
  return 'mp4';
}

/* Grab a frame ~0.4s in, for the grid thumbnail and the PDF. */
function extractPosterFrame(file, maxDim){
  maxDim = maxDim || 900;
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.muted = true;
    v.playsInline = true;
    let done = false;
    const finish = (val, err) => {
      if(done) return;
      done = true;
      URL.revokeObjectURL(url);
      err ? reject(err) : resolve(val);
    };
    v.onerror = () => finish(null, new Error('Could not read that video'));
    v.onloadedmetadata = () => {
      if(v.duration && v.duration > MAX_VIDEO_SECONDS){
        return finish(null, new Error('TOO_LONG:'+Math.round(v.duration)));
      }
      const t = Math.min(0.4, (v.duration || 1) / 2);
      const grab = () => {
        try{
          const scale = Math.min(1, maxDim / Math.max(v.videoWidth || maxDim, v.videoHeight || maxDim));
          const c = document.createElement('canvas');
          c.width  = Math.max(1, Math.round((v.videoWidth  || 640) * scale));
          c.height = Math.max(1, Math.round((v.videoHeight || 480) * scale));
          c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
          finish({ poster: c.toDataURL('image/jpeg', 0.7), duration: v.duration || 0 });
        }catch(e){ finish({ poster:'', duration: v.duration || 0 }); }
      };
      v.onseeked = grab;
      try{ v.currentTime = t; }catch(e){ grab(); }
    };
    v.src = url;
  });
}

async function uploadVideo(file, reportId){
  if(!sb || !currentUserId()) throw new Error('Not signed in');
  const id = uid();
  const path = currentUserId() + '/' + reportId + '/' + id + '.' + mediaExt(file);
  const { error } = await sb.storage.from(MEDIA_BUCKET).upload(path, file, {
    contentType: file.type || 'video/mp4',
    upsert: false
  });
  if(error) throw error;
  return { id, path };
}

async function removeStoredMedia(paths){
  if(!sb || !paths || !paths.length) return;
  try{ await sb.storage.from(MEDIA_BUCKET).remove(paths); }
  catch(e){ console.error('media remove failed', e); }
}

/* Signed links are short-lived, so we mint them on demand. */
async function signedMediaUrl(path){
  if(!sb) return null;
  try{
    const { data, error } = await sb.storage.from(MEDIA_BUCKET).createSignedUrl(path, 3600);
    if(error) throw error;
    return data.signedUrl;
  }catch(e){ console.error('signed url failed', e); return null; }
}

async function ingestVideos(fileList, targetArray){
  const files = Array.from(fileList).filter(f=>f && f.size);
  if(!files.length) return;
  if(!state.current) return;
  for(const file of files){
    if(file.size > MAX_VIDEO_BYTES){
      showToast(`"${file.name||'That video'}" is ${(file.size/1048576).toFixed(0)}MB — the limit is ${MAX_VIDEO_BYTES/1048576}MB. Trim it and try again.`);
      continue;
    }
    let meta = { poster:'', duration:0 };
    try{
      meta = await extractPosterFrame(file);
    }catch(e){
      const msg = String(e && e.message || e);
      if(msg.indexOf('TOO_LONG:') === 0){
        showToast(`That clip is ${msg.split(':')[1]}s — please keep videos under ${MAX_VIDEO_SECONDS}s.`);
        continue;   // we know the duration, so this one is a hard no
      }
      // Couldn't decode a preview frame (unusual codec, e.g. some HEVC clips).
      // Still upload it — the clip may well play fine elsewhere — just without a thumbnail.
      showToast('Added without a preview image — this browser could not read a frame from it.');
    }
    showToast('Uploading video…');
    try{
      const up = await uploadVideo(file, state.current.id);
      targetArray.push({
        id: up.id, type:'video', path: up.path,
        poster: meta.poster || '', duration: Math.round(meta.duration||0), caption:''
      });
      showToast('Video added');
    }catch(e){
      showToast('Upload failed: ' + (e.message || 'unknown error'));
    }
  }
  renderEditor();
}

/* Play a stored clip in an overlay. */
async function playMedia(path){
  const url = await signedMediaUrl(path);
  if(!url){ showToast('Could not load that video'); return; }
  const box = document.createElement('div');
  box.className = 'media-overlay';
  box.innerHTML = `<button class="media-close" aria-label="Close">&times;</button>
                   <video src="${url}" controls autoplay playsinline></video>`;
  box.onclick = e => { if(e.target === box) box.remove(); };
  box.querySelector('.media-close').onclick = () => box.remove();
  const esc = e => { if(e.key === 'Escape'){ box.remove(); document.removeEventListener('keydown', esc); } };
  document.addEventListener('keydown', esc);
  document.body.appendChild(box);
}

function mediaThumb(m, onDelete){
  if(isVideo(m)){
    const secs = m.duration ? (m.duration >= 60 ? Math.floor(m.duration/60)+'m'+String(m.duration%60).padStart(2,'0') : m.duration+'s') : '';
    return `<div class="media-thumb video" onclick="playMedia('${m.path}')">
        ${m.poster ? `<img src="${m.poster}" alt="">` : '<div class="no-poster"></div>'}
        <span class="play-badge">&#9654;</span>
        ${secs ? `<span class="dur-badge">${secs}</span>` : ''}
        <button onclick="event.stopPropagation(); ${onDelete}">&times;</button>
      </div>`;
  }
  return `<div class="media-thumb"><img src="${m.dataUrl}" alt=""><button onclick="${onDelete}">&times;</button></div>`;
}

/* ---------------- PDF export ---------------- */
function loadImageSize(dataUrl){ return new Promise(resolve=>{ const img=new Image(); img.onload=()=>resolve({w:img.naturalWidth,h:img.naturalHeight}); img.onerror=()=>resolve({w:400,h:300}); img.src=dataUrl; }); }
const STATUS_RGB = { Pass:[30,138,99], Attention:[180,121,15], Fail:[184,74,62], 'N/A':[138,143,139] };

function drawStatusBadge(doc, status, x, y){
  const rgb = STATUS_RGB[status] || STATUS_RGB['N/A'];
  const label = status || 'N/A';
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  const textW = doc.getTextWidth(label);
  const padX = 5, badgeH = 12, badgeW = textW + padX*2;
  doc.setFillColor(rgb[0],rgb[1],rgb[2]);
  doc.roundedRect(x, y-9, badgeW, badgeH, 3, 3, 'F');
  doc.setTextColor(255,255,255);
  doc.text(label, x+padX, y);
  return badgeW;
}

/* Crops an image (center-crop, cover-fit) to exactly match the target box's aspect ratio,
   returning a new dataURL sized to that ratio. Doing the crop in canvas (rather than relying
   on PDF clipping, which isn't reliably supported) guarantees the placed image can never
   overflow its box. */
function cropImageToBox(dataUrl, boxW, boxH){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => {
      const targetRatio = boxW / boxH;
      const srcRatio = img.naturalWidth / img.naturalHeight;
      let sx, sy, sw, sh;
      if(srcRatio > targetRatio){
        sh = img.naturalHeight; sw = sh * targetRatio; sy = 0; sx = (img.naturalWidth - sw) / 2;
      } else {
        sw = img.naturalWidth; sh = sw / targetRatio; sx = 0; sy = (img.naturalHeight - sh) / 2;
      }
      const outW = Math.round(boxW * 2), outH = Math.round(boxH * 2);
      const canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => reject(new Error('image load failed'));
    img.src = dataUrl;
  });
}

/* Draws an image cropped (cover-fit) to exactly fill the box, no border, guaranteed no overflow. */
async function drawCoverImage(doc, dataUrl, x, y, boxW, boxH){
  try{
    const cropped = await cropImageToBox(dataUrl, boxW, boxH);
    doc.addImage(cropped, undefined, x, y, boxW, boxH);
  }catch(e){}
}

/* A PDF can't play video, so print the poster frame with a marker. */
async function drawMedia(doc, m, x, y, boxW, boxH){
  if(isVideo(m)){
    if(m.poster){
      await drawCoverImage(doc, m.poster, x, y, boxW, boxH);
    } else {
      doc.setFillColor(18,49,58); doc.rect(x, y, boxW, boxH, 'F');
    }
    const bw = 46, bh = 12;
    doc.setFillColor(12,35,42);
    doc.roundedRect(x+3, y+boxH-bh-3, bw, bh, 3, 3, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7);
    doc.setTextColor(255,255,255);
    doc.text('> VIDEO', x+8, y+boxH-6);
  } else {
    await drawCoverImage(doc, m.dataUrl, x, y, boxW, boxH);
  }
}

/* Claude's in-chat artifact preview runs inside a restricted iframe where the normal
   anchor-download trick jsPDF uses for doc.save() can fail silently or save garbled
   raw data instead of a real PDF. Detect that case and open the PDF in a new tab
   instead, which works reliably there. Outside that context (hosted site, downloaded
   file), a normal download still works fine. */
function inRestrictedFrame(){
  try{ return window.self !== window.top; }catch(e){ return true; }
}
function savePDF(doc, filename){
  if(inRestrictedFrame()){
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    showToast('PDF opened in a new tab — use its Share/Download button to save it');
  } else {
    doc.save(filename);
    showToast('PDF exported');
  }
}

async function buildPDF(){
  await saveCurrentReport(true);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt',format:'a4'});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 44, contentW = pageW - margin*2;
  let y = margin;
  const biz = state.business, r = state.current;

  function ensureSpace(h){ if(y+h > pageH-margin){ doc.addPage(); y = margin; } }

  // Letterhead: the business-info block is a solid band in the chosen colour.
  const hc = headerRgb();
  const bandH = 78;
  doc.setFillColor(hc[0],hc[1],hc[2]);
  doc.rect(0, 0, pageW, bandH, 'F');

  // Pick readable text for whatever colour was chosen.
  const lum = (0.299*hc[0] + 0.587*hc[1] + 0.114*hc[2]) / 255;
  const fg = lum < 0.6 ? [255,255,255] : [24,28,27];
  const fgSoft = lum < 0.6 ? [222,234,232] : [70,80,78];

  const logoH = 40;
  let textX = margin;
  if(biz.logoDataUrl){
    try{
      const sz = await loadImageSize(biz.logoDataUrl);
      const w = logoH * (sz.w/sz.h);
      doc.addImage(biz.logoDataUrl, undefined, margin, (bandH-logoH)/2, w, logoH);
      textX = margin + w + 14;
    }catch(e){ textX = margin; }
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(fg[0],fg[1],fg[2]);
  doc.text(biz.companyName || 'Pool Leak Detection Report', textX, bandH/2 - 2);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(fgSoft[0],fgSoft[1],fgSoft[2]);
  doc.text([biz.companyPhone, biz.companyEmail].filter(Boolean).join('   |   '), textX, bandH/2 + 13);
  const rno = fmtReportNo(r.reportNumber);
  if(rno){
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(fg[0],fg[1],fg[2]);
    doc.text(rno, pageW-margin, bandH/2 - 2, {align:'right'});
  }

  y = bandH + 26;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(18,49,58);
  doc.text(r.reportTitle || DEFAULT_REPORT_TITLE, margin, y); y += 18;

  // Customer info
  if(r.customerHeading && r.customerHeading.trim()){
    ensureSpace(14);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(18,49,58);
    doc.text(r.customerHeading.toUpperCase(), margin, y); y += 12;
  }
  doc.setFontSize(8.5); doc.setTextColor(27,31,30);
  const custPairs = (r.customerFields||[]).map(f=>[f.label||'', f.value||'']);
  custPairs.forEach(([label,val])=>{
    const vLines = doc.splitTextToSize(String(val||'-'), contentW-95);
    ensureSpace(Math.max(12, vLines.length*11));
    doc.setFont('helvetica','bold'); doc.text(label.toUpperCase()+':', margin, y);
    doc.setFont('helvetica','normal');
    vLines.forEach((ln,i)=> doc.text(ln, margin+95, y + i*11));
    y += Math.max(12, vLines.length*11);
  });
  y += 4;

  // Job fields (2-col)
  ensureSpace(12);
  if(r.jobHeading && r.jobHeading.trim()){
    ensureSpace(14);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(18,49,58);
    doc.text(r.jobHeading.toUpperCase(), margin, y); y += 12;
    doc.setTextColor(27,31,30);
  }
  doc.setFontSize(7.5);
  const colW = contentW/2, valOffset = 85, valW = colW - valOffset - 6;
  for(let i=0; i<r.jobFields.length; i+=2){
    const pair = [r.jobFields[i], r.jobFields[i+1]];
    const wrapped = pair.map(f => f ? doc.splitTextToSize(String(f.value||'-'), valW) : null);
    const rowH = Math.max(...wrapped.map(w => w ? w.length : 1)) * 10 + 2;
    ensureSpace(rowH);
    pair.forEach((f, c) => {
      if(!f) return;
      const x = margin + c*colW;
      doc.setFont('helvetica','bold'); doc.text((f.label||'').toUpperCase()+':', x, y);
      doc.setFont('helvetica','normal');
      wrapped[c].forEach((ln, li) => doc.text(ln, x+valOffset, y + li*10));
    });
    y += rowH;
  }
  y += 10;

  // Summary
  const summaryBlocks = (r.summaryFields||[]).map(f=>[f.label||'', f.value||'']);
  const hasSummary = summaryBlocks.some(b=>b[1] && b[1].trim());
  if(hasSummary){
    ensureSpace(20);
    doc.setDrawColor(218,213,200); doc.line(margin,y,pageW-margin,y); y+=18;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(0,65,121); doc.text(r.summaryHeading || DEFAULT_SUMMARY_HEADING, margin, y); y+=16;
    summaryBlocks.forEach(([label,val])=>{
      if(!val || !val.trim()) return;
      ensureSpace(14);
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(0,65,121);
      doc.text(label, margin, y); y+=13;
      doc.setFont('helvetica','normal'); doc.setTextColor(27,31,30); doc.setFontSize(9.5);
      const lines = doc.splitTextToSize(val, contentW);
      lines.forEach(line=>{ ensureSpace(12); doc.text(line, margin, y); y+=12; });
      y+=6;
    });
  }

  // Categories
  for(let ci=0; ci<r.categories.length; ci++){
    const cat = r.categories[ci];
    ensureSpace(28);
    doc.setDrawColor(218,213,200); doc.line(margin,y,pageW-margin,y); y+=18;
    doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(18,49,58);
    doc.text((ci+1)+'.  '+(cat.title||'Untitled section'), margin, y); y+=15;

    if(cat.intro && cat.intro.trim()){
      doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(90,100,98);
      const lines = doc.splitTextToSize(cat.intro, contentW);
      lines.forEach(line=>{ ensureSpace(11); doc.text(line, margin, y); y+=11; });
      y+=6;
    }

    if(cat.items && cat.items.length){
      for(const item of cat.items){
        ensureSpace(15);
        doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(27,31,30);
        doc.text(item.label||'', margin, y);
        const skipBadge = item.status === 'N/A' || /additional findings/i.test(cat.title||'');
        if(item.status && !skipBadge) drawStatusBadge(doc, item.status, margin+250, y);
        if(item.note && item.note.trim()){
          doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,100,98);
          const noteLines = doc.splitTextToSize(item.note, contentW-320);
          doc.text(noteLines[0]||'', margin+320, y);
        }
        y += 15;

        if(item.photos && item.photos.length){
          const cols=4, gap=6, boxW=(contentW-gap*(cols-1))/cols, boxH=boxW*0.78;
          for(let pi=0; pi<item.photos.length; pi+=cols){
            ensureSpace(boxH+12);
            for(let c=0;c<cols;c++){
              const photo = item.photos[pi+c]; if(!photo) continue;
              const x = margin + c*(boxW+gap);
              await drawMedia(doc, photo, x, y, boxW, boxH);
            }
            y += boxH+12;
          }
        }
      }
      y += 4;
    }

    if(cat.photos && cat.photos.length){
      const cols=3, gap=8, boxW=(contentW-gap*(cols-1))/cols, boxH=boxW*0.72;
      for(let pi=0; pi<cat.photos.length; pi+=cols){
        ensureSpace(boxH+22);
        for(let c=0;c<cols;c++){
          const photo = cat.photos[pi+c]; if(!photo) continue;
          const x = margin + c*(boxW+gap);
          await drawMedia(doc, photo, x, y, boxW, boxH);
          if(photo.caption){ doc.setFontSize(8); doc.setTextColor(90,100,98); doc.text(photo.caption, x, y+boxH+10, {maxWidth:boxW}); }
        }
        y += boxH+22;
      }
    }
    y += 6;
  }

  // Disclaimer
  if(r.disclaimer && r.disclaimer.trim()){
    ensureSpace(30);
    doc.setDrawColor(218,213,200); doc.line(margin,y,pageW-margin,y); y+=16;
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(18,49,58); doc.text((r.disclaimerHeading || DEFAULT_DISCLAIMER_HEADING).toUpperCase(), margin, y); y+=11;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(110,115,112);
    const lines = doc.splitTextToSize(r.disclaimer, contentW);
    lines.forEach(line=>{ ensureSpace(9); doc.text(line, margin, y); y+=9; });
  }

  // Footer on last page
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,145,142);
  doc.text('© '+new Date().getFullYear()+' '+(biz.companyName||'')+'   ·   Report generated '+new Date().toLocaleDateString(), margin, pageH-24);

  const filename = ((reportClientName(r)||'report').replace(/[^a-z0-9]+/gi,'_'))+'_leak_report.pdf';
  return { doc, filename, r };
}

async function exportPDF(){
  try{
    const { doc, filename } = await buildPDF();
    savePDF(doc, filename);
  }catch(err){
    console.error('PDF export failed', err);
    showToast('PDF export failed — try removing a very large photo and export again');
  }
}

async function emailPDF(){
  try{
    const { doc, filename, r } = await buildPDF();
    const blob = doc.output('blob');
    const file = new File([blob], filename, {type:'application/pdf'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({
          files:[file],
          title: 'Your Pool Leak Detection Report',
          text: 'Hi '+(reportClientName(r)||'there')+'! Your leak report is attached. If you have any questions or concerns, please reach out to '+(state.business.companyPhone||'us')+'. Thank you!'
        });
      }catch(shareErr){
        if(!shareErr || shareErr.name !== 'AbortError'){
          savePDF(doc, filename);
          showToast('Could not open share sheet — opened the PDF instead');
        }
      }
    } else {
      savePDF(doc, filename);
      const to = encodeURIComponent(reportEmail(r) || '');
      const subject = encodeURIComponent('Your Leak Detection Report is Ready');
      const body = encodeURIComponent('Hi '+(reportClientName(r)||'')+'!\n\nYour leak report is ready — please see the attached PDF (attach the file from the previous step).\n\nIf you have any questions or concerns, please reach out to '+(state.business.companyPhone||'')+'.\n\nThank you!');
      showToast('Opening email — attach the PDF from the previous step');
      setTimeout(()=>{ window.location.href = 'mailto:'+to+'?subject='+subject+'&body='+body; }, 500);
    }
  }catch(err){
    console.error('Email PDF failed', err);
    showToast('Could not prepare the PDF — try again');
  }
}



/* ---------------- preset library (multiple named presets) ---------------- */
function tplNormalize(sections){
  return (sections||[]).map(c=>({
    id: c.id || uid(),
    title: c.title || '',
    intro: c.intro || '',
    items: (c.items||[]).map(i => typeof i === 'string' ? i : ((i && i.label) || ''))
  }));
}
async function loadTemplates(){
  let saved = await storeGet('category-presets');
  if(!saved || !saved.length){
    // migrate from the older single-template format, if present
    const legacy = await storeGet('category-template');
    saved = [{
      id: uid(),
      name: (legacy && legacy.length) ? 'My Preset' : 'Standard Leak Detection',
      isDefault: true,
      disclaimer: state.business.disclaimerDefault || DEFAULT_DISCLAIMER,
      jobHeading: 'Job Information',
      jobFields: DEFAULT_JOB_FIELDS.slice(),
      sections: (legacy && legacy.length) ? legacy : DEFAULT_CATEGORY_TEMPLATE
    }];
  }
  state.templates = saved.map(t=>({
    id: t.id || uid(),
    name: t.name || 'Untitled preset',
    isDefault: !!t.isDefault,
    disclaimer: (typeof t.disclaimer === 'string') ? t.disclaimer : (state.business.disclaimerDefault || DEFAULT_DISCLAIMER),
    jobHeading: (typeof t.jobHeading === 'string' && t.jobHeading) ? t.jobHeading : 'Job Information',
    jobFields: (t.jobFields && t.jobFields.length) ? t.jobFields.slice() : DEFAULT_JOB_FIELDS.slice(),
    reportTitle: (typeof t.reportTitle === 'string' && t.reportTitle) ? t.reportTitle : DEFAULT_REPORT_TITLE,
    customerHeading: (typeof t.customerHeading === 'string' && t.customerHeading) ? t.customerHeading : DEFAULT_CUSTOMER_HEADING,
    customerFields: (t.customerFields && t.customerFields.length)
        ? t.customerFields.map(f=>({label:f.label||'', role:f.role||''}))
        : DEFAULT_CUSTOMER_FIELDS.map(f=>({label:f.label, role:f.role})),
    summaryHeading: (typeof t.summaryHeading === 'string' && t.summaryHeading) ? t.summaryHeading : DEFAULT_SUMMARY_HEADING,
    summaryFields: (t.summaryFields && t.summaryFields.length) ? t.summaryFields.slice() : DEFAULT_SUMMARY_FIELDS.slice(),
    disclaimerHeading: (typeof t.disclaimerHeading === 'string' && t.disclaimerHeading) ? t.disclaimerHeading : DEFAULT_DISCLAIMER_HEADING,
    publishedId: t.publishedId || null,
    publishedDescription: t.publishedDescription || '',
    publishedAuthor: t.publishedAuthor || '',
    publishedWithDisclaimer: !!t.publishedWithDisclaimer,
    sections: tplNormalize(t.sections)
  }));
  if(!state.templates.length){
    state.templates = [{id:uid(), name:'Standard Leak Detection', isDefault:true, disclaimer:(state.business.disclaimerDefault || DEFAULT_DISCLAIMER), jobHeading:'Job Information', jobFields:DEFAULT_JOB_FIELDS.slice(),
             reportTitle:DEFAULT_REPORT_TITLE, customerHeading:DEFAULT_CUSTOMER_HEADING,
             customerFields:DEFAULT_CUSTOMER_FIELDS.map(f=>({label:f.label, role:f.role})),
             summaryHeading:DEFAULT_SUMMARY_HEADING, summaryFields:DEFAULT_SUMMARY_FIELDS.slice(),
             disclaimerHeading:DEFAULT_DISCLAIMER_HEADING, sections:tplNormalize(DEFAULT_CATEGORY_TEMPLATE)}];
  }
  if(!state.templates.some(t=>t.isDefault)) state.templates[0].isDefault = true;
  const def = state.templates.find(t=>t.isDefault) || state.templates[0];
  state.activeTemplateId = def.id;
}
function activeTemplate(){
  return state.templates.find(t=>t.id===state.activeTemplateId) || state.templates[0];
}
function defaultTemplate(){
  return state.templates.find(t=>t.isDefault) || state.templates[0];
}
async function persistTemplates(){
  const payload = state.templates.map(t=>({
    id: t.id, name: t.name, isDefault: t.isDefault, disclaimer: t.disclaimer || '',
    jobHeading: t.jobHeading || 'Job Information',
    jobFields: (t.jobFields||[]).filter(l=>l && l.trim()),
    reportTitle: t.reportTitle || DEFAULT_REPORT_TITLE,
    customerHeading: t.customerHeading || DEFAULT_CUSTOMER_HEADING,
    customerFields: (t.customerFields||[]).filter(f=>f.label && f.label.trim()).map(f=>({label:f.label, role:f.role||''})),
    summaryHeading: t.summaryHeading || DEFAULT_SUMMARY_HEADING,
    summaryFields: (t.summaryFields||[]).filter(l=>l && l.trim()),
    disclaimerHeading: t.disclaimerHeading || DEFAULT_DISCLAIMER_HEADING,
    publishedId: t.publishedId || null,
    publishedDescription: t.publishedDescription || '',
    publishedAuthor: t.publishedAuthor || '',
    publishedWithDisclaimer: !!t.publishedWithDisclaimer,
    sections: t.sections.map(s=>({ title:s.title, intro:s.intro, items:s.items.filter(l=>l && l.trim()) }))
  }));
  return await storeSet('category-presets', payload);
}
async function saveTemplate(){
  const result = await persistTemplates();
  if(!result.ok){ showToast('Could not save presets: '+result.message); return; }
  showToast('Presets saved');
}

/* preset-level actions */
function selectTemplate(id){ state.activeTemplateId = id; renderTemplate(); }
function addTemplate(){
  const t = {id:uid(), name:'New Preset', isDefault:false, disclaimer:(state.business.disclaimerDefault || DEFAULT_DISCLAIMER), jobHeading:'Job Information', jobFields:DEFAULT_JOB_FIELDS.slice(), sections:tplNormalize(DEFAULT_CATEGORY_TEMPLATE)};
  state.templates.push(t);
  state.activeTemplateId = t.id;
  renderTemplate();
  showToast('Preset created — rename it, then hit Save');
}
function duplicateTemplate(){
  const cur = activeTemplate();
  const copy = JSON.parse(JSON.stringify({name:cur.name+' (copy)', sections:cur.sections}));
  const t = {id:uid(), name:copy.name, isDefault:false, disclaimer:cur.disclaimer||'', jobHeading:cur.jobHeading||'Job Information', jobFields:(cur.jobFields||DEFAULT_JOB_FIELDS).slice(),
             reportTitle:cur.reportTitle||DEFAULT_REPORT_TITLE, customerHeading:cur.customerHeading||DEFAULT_CUSTOMER_HEADING,
             customerFields:(cur.customerFields||DEFAULT_CUSTOMER_FIELDS).map(f=>({label:f.label, role:f.role||''})),
             summaryHeading:cur.summaryHeading||DEFAULT_SUMMARY_HEADING, summaryFields:(cur.summaryFields||DEFAULT_SUMMARY_FIELDS).slice(),
             disclaimerHeading:cur.disclaimerHeading||DEFAULT_DISCLAIMER_HEADING, sections:tplNormalize(copy.sections)};
  state.templates.push(t);
  state.activeTemplateId = t.id;
  renderTemplate();
  showToast('Preset duplicated');
}
function deleteTemplate(){
  if(state.templates.length <= 1){ showToast('You need at least one preset'); return; }
  const cur = activeTemplate();
  if(!confirm('Delete the preset "'+cur.name+'"? This cannot be undone.')) return;
  const wasDefault = cur.isDefault;
  state.templates = state.templates.filter(t=>t.id!==cur.id);
  if(wasDefault) state.templates[0].isDefault = true;
  state.activeTemplateId = state.templates[0].id;
  renderTemplate();
  showToast('Preset deleted — hit Save to confirm');
}
function setDefaultTemplate(){
  state.templates.forEach(t=> t.isDefault = (t.id === state.activeTemplateId));
  renderTemplate();
  showToast('Set as the default for new reports');
}
function renameTemplate(name){ activeTemplate().name = name; }

/* section/item editing within the active preset */
function findTplSection(id){ return activeTemplate().sections.find(s=>s.id===id); }
function addTplSection(title){
  if(!title || !title.trim()) return;
  activeTemplate().sections.push({id:uid(), title:title.trim(), intro:'', items:[]});
  renderTemplateSections();
}
function deleteTplSection(id){
  if(!confirm('Remove this section from this preset?')) return;
  const t = activeTemplate();
  t.sections = t.sections.filter(s=>s.id!==id);
  renderTemplateSections();
}
function moveTplSection(id, dir){
  const arr = activeTemplate().sections, i = arr.findIndex(s=>s.id===id), j = i+dir;
  if(j<0 || j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  renderTemplateSections();
}
function addTplItem(secId, label){
  if(!label || !label.trim()) return;
  findTplSection(secId).items.push(label.trim());
  renderTemplateSections();
}
function deleteTplItem(secId, idx){ findTplSection(secId).items.splice(idx,1); renderTemplateSections(); }
function moveTplItem(secId, idx, dir){
  const items = findTplSection(secId).items, j = idx+dir;
  if(j<0 || j>=items.length) return;
  [items[idx],items[j]]=[items[j],items[idx]];
  renderTemplateSections();
}
function resetTemplate(){
  if(!confirm('Reset this preset back to the original default sections? Nothing is saved until you hit Save.')) return;
  activeTemplate().sections = tplNormalize(DEFAULT_CATEGORY_TEMPLATE);
  renderTemplateSections();
  showToast('Reset — hit Save to keep this');
}
function goTemplate(){ state.view='template'; render(); }

function addTplCustField(label){
  if(!label || !label.trim()) return;
  const t = activeTemplate(); t.customerFields = t.customerFields || [];
  t.customerFields.push({label:label.trim(), role:''});
  renderTplCustFields();
}
function deleteTplCustField(i){ activeTemplate().customerFields.splice(i,1); renderTplCustFields(); }
function moveTplCustField(i,dir){
  const a = activeTemplate().customerFields, j=i+dir;
  if(j<0||j>=a.length) return;
  [a[i],a[j]]=[a[j],a[i]]; renderTplCustFields();
}
function renderTplCustFields(){
  const wrap = document.getElementById('tplCustFields');
  if(!wrap) return;
  const fields = activeTemplate().customerFields || [];
  wrap.innerHTML = fields.map((f,i)=>`
    <div class="tpl-item-row">
      <input class="tpl-custlabel" data-idx="${i}" value="${esc(f.label)}" placeholder="Field name">
      <select class="tpl-custrole" data-idx="${i}" style="border:1px solid var(--line);border-radius:6px;padding:6px;font-size:11.5px;font-family:'Inter',sans-serif;">
        ${CUSTOMER_ROLES.map(r=>`<option value="${r.value}" ${r.value===(f.role||'')?'selected':''}>${r.label}</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-sm" title="Move up" onclick="moveTplCustField(${i},-1)">&uarr;</button>
      <button class="btn btn-outline btn-sm" title="Move down" onclick="moveTplCustField(${i},1)">&darr;</button>
      <button class="item-del" onclick="deleteTplCustField(${i})">&times;</button>
    </div>`).join('');
  wrap.querySelectorAll('input.tpl-custlabel').forEach(inp=>{
    inp.oninput = e => { activeTemplate().customerFields[+e.target.dataset.idx].label = e.target.value; };
  });
  wrap.querySelectorAll('select.tpl-custrole').forEach(sel=>{
    sel.onchange = e => {
      const idx = +e.target.dataset.idx, role = e.target.value, arr = activeTemplate().customerFields;
      if(role) arr.forEach((f,i)=>{ if(i!==idx && f.role===role) f.role=''; });  // a role belongs to one field
      arr[idx].role = role;
      renderTplCustFields();
    };
  });
}

        ? '<span class="preset-default-badge">&#9733; Default for new reports</span>'
        : '<button class="btn btn-outline btn-sm" onclick="setDefaultTemplate()">Make default</button>'}
      <button class="btn btn-outline btn-sm" onclick="duplicateTemplate()">Duplicate</button>
      <button class="btn btn-danger btn-sm" onclick="deleteTemplate()">Delete preset</button>
    </div>
    <div class="preset-toolbar" style="margin-top:-8px;">
      ${cur.publishedId
        ? `<span class="pub-state">&#9679; Submitted to the catalogue</span>
           <button class="btn btn-outline btn-sm" onclick="showPublishDialog()">Update entry</button>
           <button class="btn btn-outline btn-sm" onclick="unpublishPreset()">Unpublish</button>`
        : `<button class="btn btn-outline btn-sm" onclick="showPublishDialog()">Submit to catalogue</button>`}
      <button class="btn btn-outline btn-sm" onclick="goCatalogue()">Browse catalogue</button>
    </div>`;
  const nameInput = document.getElementById('tplName');
  // Update the matching tab label live. Deliberately no re-render on blur: rebuilding
  // the toolbar here would detach whatever button the user is mid-click on and swallow it.
  nameInput.oninput = e => {
    renameTemplate(e.target.value);
    const tab = bar.querySelector('.preset-tab.active');
    if(tab) tab.innerHTML = (activeTemplate().isDefault ? '<span class="star">&#9733;</span> ' : '') + esc(e.target.value);
  };
  const disc = document.getElementById('tplDisclaimer');
  if(disc){
    disc.oninput = e => { activeTemplate().disclaimer = e.target.value; };
    autoGrowTextareas(disc.parentNode);
  }
  const jh = document.getElementById('tplJobHeading');
  if(jh) jh.oninput = e => { activeTemplate().jobHeading = e.target.value; };
  const rt = document.getElementById('tplReportTitle');
  if(rt) rt.oninput = e => { activeTemplate().reportTitle = e.target.value; };
  const ch = document.getElementById('tplCustHeading');
  if(ch) ch.oninput = e => { activeTemplate().customerHeading = e.target.value; };
  const sh = document.getElementById('tplSumHeading');
  if(sh) sh.oninput = e => { activeTemplate().summaryHeading = e.target.value; };
  const dh = document.getElementById('tplDiscHeading');
  if(dh) dh.oninput = e => { activeTemplate().disclaimerHeading = e.target.value; };
  renderTplJobFields();
  renderTplCustFields();
  renderTplSumFields();
}

function renderTemplateSections(){
  const wrap = document.getElementById('tplWrap');
  if(!wrap) return;
  wrap.innerHTML = activeTemplate().sections.map((sec,si)=>`
    <div class="cat">
      <div class="cat-head">
        <div class="cat-tag">${String(si+1).padStart(2,'0')}</div>
        <input class="cat-title tpl-title" value="${esc(sec.title)}" data-sec="${sec.id}" placeholder="Section title">
        <button class="btn btn-outline btn-sm" title="Move up" onclick="moveTplSection('${sec.id}',-1)">&uarr;</button>
        <button class="btn btn-outline btn-sm" title="Move down" onclick="moveTplSection('${sec.id}',1)">&darr;</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTplSection('${sec.id}')">Delete</button>
      </div>
      <div class="cat-body">
        <textarea class="cat-intro tpl-intro" placeholder="Optional intro note shown under this section..." data-sec="${sec.id}">${esc(sec.intro)}</textarea>
        ${sec.items.map((label,ii)=>`
          <div class="tpl-item-row">
            <input class="tpl-item" data-sec="${sec.id}" data-idx="${ii}" value="${esc(label)}" placeholder="Checklist item">
            <button class="btn btn-outline btn-sm" title="Move up" onclick="moveTplItem('${sec.id}',${ii},-1)">&uarr;</button>
            <button class="btn btn-outline btn-sm" title="Move down" onclick="moveTplItem('${sec.id}',${ii},1)">&darr;</button>
            <button class="item-del" onclick="deleteTplItem('${sec.id}',${ii})">&times;</button>
          </div>`).join('')}
        <div class="add-item-row">
          <input placeholder="Add checklist item..." id="newtplitem_${sec.id}" onkeydown="if(event.key==='Enter'){addTplItem('${sec.id}', this.value); this.value='';}">
          <button class="btn btn-outline btn-sm" onclick="const i=document.getElementById('newtplitem_${sec.id}'); addTplItem('${sec.id}', i.value); i.value='';">+ Item</button>
        </div>
      </div>
    </div>`).join('');

  wrap.querySelectorAll('input.tpl-title').forEach(inp=>{ inp.oninput = e=>{ findTplSection(e.target.dataset.sec).title = e.target.value; }; });
  wrap.querySelectorAll('textarea.tpl-intro').forEach(ta=>{ ta.oninput = e=>{ findTplSection(e.target.dataset.sec).intro = e.target.value; }; });
  wrap.querySelectorAll('input.tpl-item').forEach(inp=>{ inp.oninput = e=>{ findTplSection(e.target.dataset.sec).items[+e.target.dataset.idx] = e.target.value; }; });
  autoGrowTextareas(wrap);
}

}
