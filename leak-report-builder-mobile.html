/* ---------------- public preset catalogue ---------------- */
/* Presets carry structure only (headings, section titles, field labels),
   never client values or report content — so sharing one cannot leak
   customer data. Disclaimer text is the sole free-text field, so
   including it is an explicit opt-in at publish time. */

function presetToPublicData(t, includeDisclaimer){
  return {
    reportTitle:       t.reportTitle || DEFAULT_REPORT_TITLE,
    customerHeading:   t.customerHeading || DEFAULT_CUSTOMER_HEADING,
    customerFields:    (t.customerFields||[]).filter(f=>f.label && f.label.trim())
                          .map(f=>({label:f.label, role:f.role||''})),
    jobHeading:        t.jobHeading || 'Job Information',
    jobFields:         (t.jobFields||[]).filter(l=>l && l.trim()),
    summaryHeading:    t.summaryHeading || DEFAULT_SUMMARY_HEADING,
    summaryFields:     (t.summaryFields||[]).filter(l=>l && l.trim()),
    disclaimerHeading: t.disclaimerHeading || DEFAULT_DISCLAIMER_HEADING,
    disclaimer:        includeDisclaimer ? (t.disclaimer || '') : '',
    sections:          (t.sections||[]).map(s=>({
                          title: s.title || '',
                          intro: s.intro || '',
                          items: (s.items||[]).filter(l=>l && l.trim())
                       }))
  };
}

function countPresetItems(d){
  return (d.sections||[]).reduce((n,s)=>n + (s.items||[]).length, 0);
}

async function loadCatalogue(){
  if(!sb || !currentUserId()) return;
  state.catBusy = true; renderCatalogue();
  try{
    const { data, error } = await sb.from('public_presets')
      .select('id, owner_id, name, description, author_name, data, copy_count, updated_at, review_state, review_note')
      .order('updated_at', { ascending:false });
    if(error) throw error;
    state.catalogue = data || [];
    state.catError = null;
  }catch(e){
    console.error('catalogue load failed', e);
    state.catalogue = [];
    state.catError = e.message || String(e);
  }
  state.catBusy = false;
  renderCatalogue();
}

function goCatalogue(){
  state.view = 'catalogue';
  render();
  loadCatalogue();
}
function setCatSearch(v){ state.catSearch = v; renderCatalogueList(); }
function toggleCatPreview(id){
  state.catExpanded = (state.catExpanded === id) ? null : id;
  // the same toggle serves the catalogue and the review queue, so
  // refresh whichever list is actually on screen
  if(state.view === 'review') renderReviewList(); else renderCatalogueList();
}

/* ---- publishing ---- */
function showPublishDialog(){
  const t = activeTemplate();
  const already = !!t.publishedId;
  const box = document.createElement('div');
  box.id = 'publishDialog';
  box.className = 'modal-backdrop';
  box.onclick = e => { if(e.target === box) box.remove(); };
  box.innerHTML = `
    <div class="modal">
      <h3>${already ? 'Update catalogue entry' : 'Submit to the catalogue'}</h3>
      <p>An admin reviews submissions before they appear for other users. Editing an approved entry sends it back for review.</p>
      <div class="field" style="margin-bottom:10px;">
        <label>Name</label>
        <input id="pubName" value="${esc(t.name||'')}" maxlength="80">
      </div>
      <div class="field" style="margin-bottom:10px;">
        <label>What is it for? (optional)</label>
        <textarea id="pubDesc" maxlength="240" style="min-height:60px;">${esc(t.publishedDescription||'')}</textarea>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Published by</label>
        <input id="pubAuthor" value="${esc(t.publishedAuthor || state.business.companyName || '')}" maxlength="60">
      </div>
      <label class="pub-check">
        <input type="checkbox" id="pubDisc" ${t.publishedWithDisclaimer ? 'checked' : ''}>
        <span>Also share my disclaimer text</span>
      </label>
      <div class="pub-note">
        Shared either way: your headings, section titles, and field labels.
        Never shared: clients, photos, videos, or anything from a report.
        Your disclaimer often names your business and its terms, so it stays out unless you tick the box.
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="document.getElementById('publishDialog').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="publishPreset()">${already ? 'Update' : 'Publish'}</button>
      </div>
    </div>`;
  document.body.appendChild(box);
}

async function publishPreset(){
  const t = activeTemplate();
  const name   = (document.getElementById('pubName').value||'').trim();
  const desc   = (document.getElementById('pubDesc').value||'').trim();
  const author = (document.getElementById('pubAuthor').value||'').trim();
  const incDisc = document.getElementById('pubDisc').checked;
  if(!name){ showToast('Give it a name first'); return; }

  const id = t.publishedId || uid();
  try{
    const { error } = await sb.from('public_presets').upsert({
      id,
      owner_id: currentUserId(),
      name,
      description: desc || null,
      author_name: author || null,
      data: presetToPublicData(t, incDisc)
    }, { onConflict:'id' });
    if(error) throw error;
    t.publishedId = id;
    t.publishedDescription = desc;
    t.publishedAuthor = author;
    t.publishedWithDisclaimer = incDisc;
    await persistTemplates();
    const dlg = document.getElementById('publishDialog');
    if(dlg) dlg.remove();
    showToast('Submitted — an admin will review it before it appears for others');
    renderPresetBar();
  }catch(e){
    showToast('Could not publish: ' + (e.message || 'unknown error'));
  }
}

async function unpublishPreset(){
  const t = activeTemplate();
  if(!t.publishedId) return;
  if(!confirm('Remove this preset from the public catalogue? Your own copy stays put.')) return;
  try{
    const { error } = await sb.from('public_presets').delete().eq('id', t.publishedId);
    if(error) throw error;
    t.publishedId = null;
    await persistTemplates();
    showToast('Removed from the catalogue');
    renderPresetBar();
  }catch(e){
    showToast('Could not remove it: ' + (e.message || 'unknown error'));
  }
}

/* ---- copying ---- */
async function copyFromCatalogue(id){
  const entry = state.catalogue.find(c=>c.id===id);
  if(!entry) return;
  const d = entry.data || {};
  const t = {
    id: uid(),
    name: (entry.name || 'Copied preset').slice(0,80),
    isDefault: false,
    reportTitle:       d.reportTitle || DEFAULT_REPORT_TITLE,
    customerHeading:   d.customerHeading || DEFAULT_CUSTOMER_HEADING,
    customerFields:    (d.customerFields && d.customerFields.length)
                          ? d.customerFields.map(f=>({label:f.label||'', role:f.role||''}))
                          : DEFAULT_CUSTOMER_FIELDS.map(f=>({label:f.label, role:f.role})),
    jobHeading:        d.jobHeading || 'Job Information',
    jobFields:         (d.jobFields && d.jobFields.length) ? d.jobFields.slice() : DEFAULT_JOB_FIELDS.slice(),
    summaryHeading:    d.summaryHeading || DEFAULT_SUMMARY_HEADING,
    summaryFields:     (d.summaryFields && d.summaryFields.length) ? d.summaryFields.slice() : DEFAULT_SUMMARY_FIELDS.slice(),
    disclaimerHeading: d.disclaimerHeading || DEFAULT_DISCLAIMER_HEADING,
    disclaimer:        d.disclaimer || state.business.disclaimerDefault || DEFAULT_DISCLAIMER,
    sections:          tplNormalize(d.sections || DEFAULT_CATEGORY_TEMPLATE),
    publishedId: null
  };
  state.templates.push(t);
  const res = await persistTemplates();
  if(!res.ok){
    state.templates = state.templates.filter(x=>x.id!==t.id);
    showToast('Could not save the copy: ' + res.message);
    return;
  }
  try{ await sb.rpc('increment_preset_copies', { preset_id: id }); }catch(e){ /* cosmetic only */ }
  state.activeTemplateId = t.id;
  showToast('Copied into your presets');
  state.view = 'template';
  render();
}

/* ---- rendering ---- */
function catalogueMatches(){
  const q = (state.catSearch||'').toLowerCase();
  if(!q) return state.catalogue;
  return state.catalogue.filter(c =>
    (c.name||'').toLowerCase().includes(q) ||
    (c.description||'').toLowerCase().includes(q) ||
    (c.author_name||'').toLowerCase().includes(q) ||
    (c.data && (c.data.sections||[]).some(s=>(s.title||'').toLowerCase().includes(q)))
  );
}

function renderCatalogueList(){
  const wrap = document.getElementById('catList');
  if(!wrap) return;
  if(state.catBusy){ wrap.innerHTML = '<div class="cat-empty">Loading…</div>'; return; }
  if(state.catError){
    wrap.innerHTML = `<div class="msg err">Could not load the catalogue: ${esc(state.catError)}<br>
      <span style="font-size:12px;">If this is the first run, check that <code>supabase-catalogue-setup.sql</code> has been run.</span></div>`;
    return;
  }
  const items = catalogueMatches();
  if(!items.length){
    wrap.innerHTML = `<div class="cat-empty">${state.catalogue.length
      ? 'Nothing matches that search.'
      : 'The catalogue is empty. Publish one of your presets to start it off.'}</div>`;
    return;
  }
  wrap.innerHTML = items.map(c=>{
    const d = c.data || {};
    const mine = c.owner_id === currentUserId();
    const open = state.catExpanded === c.id;
    return `
    <div class="cat-card">
      <div class="cat-head">
        <div style="flex:1;min-width:180px;">
          <div class="cat-name">${esc(c.name||'Untitled')}${mine?' <span class="cat-mine">yours</span>':''}${mine?' '+reviewBadge(c.review_state||'pending'):''}</div>
          <div class="cat-meta">
            ${c.author_name ? esc(c.author_name)+' &middot; ' : ''}
            ${(d.sections||[]).length} section${(d.sections||[]).length===1?'':'s'} &middot;
            ${countPresetItems(d)} items${c.copy_count ? ' &middot; copied '+c.copy_count+'&times;' : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" onclick="toggleCatPreview('${c.id}')">${open?'Hide':'Preview'}</button>
          <button class="btn btn-primary btn-sm" onclick="copyFromCatalogue('${c.id}')">Copy to my presets</button>
        </div>
      </div>
      ${c.description ? `<div class="cat-desc">${esc(c.description)}</div>` : ''}
      ${mine && c.review_note ? `<div class="rev-note">Reviewer note: ${esc(c.review_note)}</div>` : ''}
      ${open ? cataloguePreviewHtml(d) : ''}
    </div>`;
  }).join('');
}


/* ---------------- catalogue moderation ---------------- */
async function checkAdmin(){
  if(!sb || !currentUserId()){ state.isAdmin = false; return; }
  try{
    const { data, error } = await sb.rpc('is_admin');
    if(error) throw error;
    state.isAdmin = !!data;
  }catch(e){ state.isAdmin = false; }
}

function reviewBadge(st){
  if(st === 'approved') return '<span class="rev-badge ok">Live</span>';
  if(st === 'rejected') return '<span class="rev-badge no">Not approved</span>';
  return '<span class="rev-badge wait">Pending review</span>';
}

function goReview(){
  state.view = 'review';
  render();
  loadReviewQueue();
}

async function loadReviewQueue(){
  if(!sb || !state.isAdmin) return;
  state.revBusy = true; renderReviewList();
  try{
    const { data, error } = await sb.from('public_presets')
      .select('id, owner_id, name, description, author_name, data, review_state, review_note, copy_count, updated_at')
      .order('updated_at', { ascending:false });
    if(error) throw error;
    state.reviewQueue = data || [];
    state.revError = null;
  }catch(e){
    state.reviewQueue = [];
    state.revError = e.message || String(e);
  }
  state.revBusy = false;
  renderReviewList();
}

function setRevFilter(f){ state.revFilter = f; renderReviewList(); }

async function reviewPreset(id, newState){
  let note = null;
  if(newState === 'rejected'){
    try{ note = prompt('Why is this being turned down? (optional — the publisher sees this)') || null; }
    catch(e){ note = null; }
  }
  try{
    const { error } = await sb.rpc('review_preset', { preset_id:id, new_state:newState, note });
    if(error) throw error;
    showToast(newState === 'approved' ? 'Approved — now visible to everyone' : 'Turned down');
    await loadReviewQueue();
  }catch(e){
    showToast('Could not update: ' + (e.message || 'unknown error'));
  }
}

async function adminDeleteEntry(id){
  if(!confirm('Delete this catalogue entry outright? The publisher keeps their own copy.')) return;
  try{
    const { error } = await sb.from('public_presets').delete().eq('id', id);
    if(error) throw error;
    showToast('Entry deleted');
    await loadReviewQueue();
  }catch(e){
    showToast('Could not delete: ' + (e.message || 'unknown error'));
  }
}

function renderReviewList(){
  const wrap = document.getElementById('revList');
  if(!wrap) return;
  if(state.revBusy){ wrap.innerHTML = '<div class="cat-empty">Loading…</div>'; return; }
  if(state.revError){
    wrap.innerHTML = `<div class="msg err">Could not load the queue: ${esc(state.revError)}<br>
      <span style="font-size:12px;">Check that <code>supabase-moderation-setup.sql</code> has been run.</span></div>`;
    return;
  }
  const f = state.revFilter || 'pending';
  const items = state.reviewQueue.filter(c => f === 'all' ? true : (c.review_state||'pending') === f);
  const counts = {
    pending:  state.reviewQueue.filter(c=>(c.review_state||'pending')==='pending').length,
    approved: state.reviewQueue.filter(c=>c.review_state==='approved').length,
    rejected: state.reviewQueue.filter(c=>c.review_state==='rejected').length,
    all:      state.reviewQueue.length
  };
  const chips = [['pending','Pending'],['approved','Live'],['rejected','Turned down'],['all','All']]
    .map(([k,lbl])=>`<button class="filter-chip ${f===k?'active':''}" onclick="setRevFilter('${k}')">${lbl} <span class="cnt">${counts[k]}</span></button>`).join('');

  wrap.innerHTML = `<div class="filter-chips">${chips}</div>` + (items.length ? items.map(c=>{
    const d = c.data || {};
    const st = c.review_state || 'pending';
    return `
    <div class="cat-card">
      <div class="cat-head">
        <div style="flex:1;min-width:180px;">
          <div class="cat-name">${esc(c.name||'Untitled')} ${reviewBadge(st)}</div>
          <div class="cat-meta">
            ${c.author_name ? esc(c.author_name)+' &middot; ' : ''}
            ${(d.sections||[]).length} sections &middot; ${countPresetItems(d)} items
            ${d.disclaimer ? ' &middot; includes a disclaimer' : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" onclick="toggleCatPreview('${c.id}')">${state.catExpanded===c.id?'Hide':'Inspect'}</button>
          ${st !== 'approved' ? `<button class="btn btn-primary btn-sm" onclick="reviewPreset('${c.id}','approved')">Approve</button>` : ''}
          ${st !== 'rejected' ? `<button class="btn btn-outline btn-sm" onclick="reviewPreset('${c.id}','rejected')">Turn down</button>` : ''}
          <button class="btn btn-danger btn-sm" onclick="adminDeleteEntry('${c.id}')">Delete</button>
        </div>
      </div>
      ${c.description ? `<div class="cat-desc">${esc(c.description)}</div>` : ''}
      ${c.review_note ? `<div class="rev-note">Reviewer note: ${esc(c.review_note)}</div>` : ''}
      ${state.catExpanded===c.id ? cataloguePreviewHtml(d) : ''}
    </div>`;
  }).join('') : `<div class="cat-empty">Nothing ${f==='all'?'in the catalogue':'in this state'}.</div>`);
}

function cataloguePreviewHtml(d){
  return `<div class="cat-preview">
    <div class="cat-prev-row"><b>Report title</b> ${esc(d.reportTitle||'—')}</div>
    <div class="cat-prev-row"><b>${esc(d.customerHeading||'Customer')}</b> ${(d.customerFields||[]).map(f=>esc(f.label)).join(', ')||'—'}</div>
    <div class="cat-prev-row"><b>${esc(d.jobHeading||'Job')}</b> ${(d.jobFields||[]).map(esc).join(', ')||'—'}</div>
    <div class="cat-prev-row"><b>${esc(d.summaryHeading||'Summary')}</b> ${(d.summaryFields||[]).map(esc).join(', ')||'—'}</div>
    ${(d.sections||[]).map((s,i)=>`
      <div class="cat-sect">
        <div class="cat-sect-title">${i+1}. ${esc(s.title||'')}</div>
        ${(s.items||[]).length ? `<div class="cat-sect-items">${(s.items||[]).map(esc).join(' &middot; ')}</div>` : ''}
      </div>`).join('')}
    ${d.disclaimer ? `<div class="cat-prev-row" style="margin-top:8px;"><b>Disclaimer</b><div class="cat-disc">${esc(d.disclaimer)}</div></div>`
                   : `<div class="cat-prev-row" style="margin-top:8px;"><b>Disclaimer</b> not shared</div>`}
  </div>`;
}

  if(state.view !== 'review') return;
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="back-link" onclick="goList()">&larr; All Reports</div>
    <div class="list-header"><div><h1>Catalogue Review</h1><p>Submissions stay hidden from other users until you approve them.</p></div></div>
    <div id="revList"></div>
  `;
  renderReviewList();
}

function renderCatalogue(){
  if(state.view !== 'catalogue') return;

    <div class="back-link" onclick="goList()">&larr; All Reports</div>
    <div class="list-header"><div><h1>Preset Catalogue</h1><p>Presets shared by other users. Copy any of them into your own list and edit freely.</p></div></div>
    <input class="search" placeholder="Search catalogue..." value="${esc(state.catSearch||'')}" oninput="setCatSearch(this.value)">
    <div id="catList"></div>

function renderTemplate(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="back-link" onclick="goList()">&larr; All Reports</div>

const MAIN_EL = 'app';
function render(){ renderTopbar(); if(state.recovering || !state.session) return renderLogin(); if(state.view==='list') renderList(); else if(state.view==='settings') renderSettings(); else if(state.view==='template') renderTemplate(); else if(state.view==='catalogue') renderCatalogue(); else if(state.view==='review') renderReview(); else renderEditor(); }

function renderTopbar(){
  const el = document.getElementById('topbarActions');
  if(state.recovering || !state.session){ el.innerHTML = ''; return; }
  if(state.view==='list'){
    el.innerHTML = `<button class="btn btn-ghost" onclick="signOut()">Sign out</button><button class="btn btn-ghost" onclick="goSettings()">Business Settings</button><button class="btn btn-ghost" onclick="goTemplate()">Preset Sections</button><button class="btn btn-ghost" onclick="goCatalogue()">Catalogue</button>${state.isAdmin?'<button class="btn btn-ghost" onclick="goReview()">Review</button>':''}<label class="btn btn-ghost" style="cursor:pointer;">Restore Backup<input type="file" accept="application/json" style="display:none;" onchange="restoreReportBackup(this.files)"></label><button class="btn btn-primary" onclick="startNewReport()">+ New Report</button>`;
  } else {
    el.innerHTML = `<button class="btn btn-ghost" onclick="goList()">&larr; All Reports</button>`;
  }
}
function goList(){ state.view='list'; state.current=null; render(); }
function goSettings(){ state.view='settings'; render(); }

function collectSettingsAndSave(){
  state.business.companyName = document.getElementById('s_name').value;
  state.business.companyPhone = document.getElementById('s_phone').value;
  state.business.companyEmail = document.getElementById('s_email').value;
  const hex = document.getElementById('s_headercolor').value;
  state.business.headerColor = /^#[0-9a-f]{6}$/i.test(hex) ? hex : '#004179';
  saveBusiness();
}
function wireHeaderColor(){
  const picker = document.getElementById('s_headercolor');
  const hexbox = document.getElementById('s_headerhex');
  if(!picker || !hexbox) return;
  picker.oninput = e => { hexbox.value = e.target.value; };
  hexbox.oninput = e => { if(/^#[0-9a-f]{6}$/i.test(e.target.value.trim())) picker.value = e.target.value.trim(); };
}

function addCustomerField(){ state.current.customerFields.push({id:uid(), label:'New Field', role:'', value:''}); renderEditor(); }
function deleteCustomerField(id){ state.current.customerFields = state.current.customerFields.filter(f=>f.id!==id); renderEditor(); }
function moveCustomerField(id,dir){ const a=state.current.customerFields; const i=a.findIndex(f=>f.id===id); const j=i+dir; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; renderEditor(); }
function renderCustomerFields(){
  const wrap = document.getElementById('custFieldsWrap');
  if(!wrap) return;
  wrap.innerHTML = state.current.customerFields.map(f=>`
    <div class="kv-row">
      <textarea class="kv-label" rows="1" data-id="${f.id}" data-part="label" placeholder="Field name">${esc(f.label)}</textarea>
      <textarea class="kv-value" rows="1" data-id="${f.id}" data-part="value">${esc(f.value)}</textarea>
      <button class="item-del" title="Move up" onclick="moveCustomerField('${f.id}',-1)">&uarr;</button>
      <button class="item-del" title="Move down" onclick="moveCustomerField('${f.id}',1)">&darr;</button>
      <button class="item-del" onclick="deleteCustomerField('${f.id}')">&times;</button>
    </div>`).join('');
  wrap.querySelectorAll('textarea').forEach(inp=>{
    inp.oninput = e => {
      const f = state.current.customerFields.find(x=>x.id===e.target.dataset.id);
      if(f) f[e.target.dataset.part] = e.target.value;
    };
  });
  autoGrowTextareas(wrap);
}
function addSummaryField(){ state.current.summaryFields.push({id:uid(), label:'New Field', value:''}); renderEditor(); }
function deleteSummaryField(id){ state.current.summaryFields = state.current.summaryFields.filter(f=>f.id!==id); renderEditor(); }
function moveSummaryField(id,dir){ const a=state.current.summaryFields; const i=a.findIndex(f=>f.id===id); const j=i+dir; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; renderEditor(); }

  });
  wrap.querySelectorAll('textarea.sum-value').forEach(ta=>{

function updateShareHint(){
  const el = document.getElementById('shareHint');
  if(!el || !state.current) return;
  const email = (reportEmail(state.current)||'').trim();
  if(!state.current.sharedWithClient){
    el.className = 'share-hint';
    el.textContent = 'Off — only you can see this report.';
    return;
  }
  if(!email){
    el.className = 'share-hint warn';
    el.textContent = 'No client email set. Fill in the field tagged with the Email role above, or the client will not be able to reach this report.';
    return;
  }
  el.className = 'share-hint';
  el.textContent = 'Visible to ' + email + ' after they sign in to the portal.';
}

  });
  wrap.querySelectorAll('.photo-thumb .caption').forEach(inp=>{
    inp.oninput = e => { const cat=findCat(e.target.dataset.cat); const photo=cat.photos.find(p=>p.id===e.target.dataset.photo); if(photo) photo.caption = e.target.value; };
  });
}

init();
</script>
</body>
</html>
